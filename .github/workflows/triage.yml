name: Triage tasks

on: pull_request_target

concurrency:
  group: "triage-${{ github.event.number }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  triage:
    runs-on: ubuntu-slim
    environment: github_actions
    steps:
      - name: Label pull request
        uses: Homebrew/actions/label-pull-requests@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        if: always()
        with:
          token: ${{ secrets.BOT_TOKEN }}
          def: |
            - label: macos only
              content: depends_on :macos
            
            - label: linux only
              content: depends_on :linux
