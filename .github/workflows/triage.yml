name: Triage tasks

on: pull_request_target

concurrency:
  group: "triage-${{ github.event.number }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  triage:
    runs-on: ubuntu-slim
    environment: github_actions
    steps:
      - name: Label pull request
        uses: Homebrew/actions/label-pull-requests@848c272c7bfe984a197bd4d16383f4c106ec61e6 # 2026.09.21.1
        if: always()
        with:
          token: ${{ secrets.BOT_TOKEN }}
          def: |
            - label: macos only
              content: depends_on :macos
            
            - label: linux only
              content: depends_on :linux
