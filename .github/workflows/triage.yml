name: Triage tasks

on: pull_request_target

concurrency:
  group: "triage-${{ github.event.number }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  triage:
    runs-on: ubuntu-slim
    environment: github_actions
    steps:
      - name: Label pull request
        uses: Homebrew/actions/label-pull-requests@f8d4222eb633e65c2a0157383cf80861fc7fae7f # 2026.09.07.1
        if: always()
        with:
          token: ${{ secrets.BOT_TOKEN }}
          def: |
            - label: macos only
              content: depends_on :macos
            
            - label: linux only
              content: depends_on :linux
