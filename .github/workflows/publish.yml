name: brew pr-pull

run-name: "Publish PR #${{ inputs.pull_request }}"

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        type: number
        required: true
      autosquash:
        description: "Squash pull request commits according to Homebrew style? (default: false)"
        type: boolean
        required: false
        default: false
      large_runner:
        description: "Unused here; declared so `brew pr-publish` can dispatch this workflow"
        type: boolean
        required: false
        default: false
      message:
        description: "Message to include when autosquashing (requires autosquash)"
        required: false
      head_sha:
        description: Expected pull request head commit SHA (optional)
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ inputs.pull_request }}
  cancel-in-progress: false

permissions:
  actions: read
  attestations: write # for actions/attest
  contents: write
  id-token: write # for actions/attest
  packages: write
  pull-requests: write

env:
  GH_REPO: ${{ github.repository }}
  PR: ${{ inputs.pull_request }}

jobs:
  pr-pull:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/homebrew/ubuntu22.04:main
      options: --user=linuxbrew
    defaults:
      run:
        shell: bash
        working-directory: /github/home
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@a657b8b0cd35d0f65cce41fce9b24cf054b49869 # 2026.08.24.1

      - name: Set up git
        uses: Homebrew/actions/git-user-config@a657b8b0cd35d0f65cce41fce9b24cf054b49869 # 2026.08.24.1

      - name: Checkout PR branch
        id: checkout
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr checkout "$PR"
          head_ref="$(gh pr view "$PR" --json headRefName --jq .headRefName)"
          if [[ -z "$head_ref" ]]
          then
            echo "::error ::Failed to resolve the head branch of PR #$PR!"
            exit 1
          fi
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"

      - name: Pull bottles
        id: brew-pr-pull
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ github.token }}
          HOMEBREW_GITHUB_PACKAGES_USER: ${{ github.repository_owner }}
          AUTOSQUASH: ${{ inputs.autosquash }}
          INPUT_MESSAGE: ${{ inputs.message }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          pr_pull_args=(
            --debug
            --retain-bottle-dir
            --no-cherry-pick
            --tap="$GH_REPO"
            --workflows=tests.yml
          )

          # `--autosquash` rewords and reformats commits; `--clean` leaves them alone.
          if [[ "$AUTOSQUASH" = "true" ]]
          then
            pr_pull_args+=(--autosquash)
            if [[ -n "$INPUT_MESSAGE" ]]
            then
              pr_pull_args+=(--message="$INPUT_MESSAGE")
            fi
          else
            pr_pull_args+=(--clean)
          fi

          if [[ -n "$INPUT_HEAD_SHA" ]]
          then
            pr_pull_args+=(--head-sha="$INPUT_HEAD_SHA")
          fi

          brew pr-pull "${pr_pull_args[@]}" "$PR"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Generate build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "${{ steps.brew-pr-pull.outputs.bottle_path }}/*.tar.gz"

      - name: Push commits
        uses: Homebrew/actions/git-try-push@a657b8b0cd35d0f65cce41fce9b24cf054b49869 # 2026.08.24.1
        with:
          token: ${{ github.token }}
          directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
          branch: ${{ steps.checkout.outputs.head_ref }}

      - name: Wait until PR branch is in sync with local repository
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        env:
          EXPECTED_SHA: ${{ steps.brew-pr-pull.outputs.head_sha }}
        run: |
          echo "::notice::Local repository HEAD: $EXPECTED_SHA"

          # Wait (with exponential backoff) until the PR branch is in sync
          max_attempts=10
          attempt=0
          timeout=1
          while [[ "$attempt" -lt "$max_attempts" ]]
          do
            remote_head="$(git ls-remote origin "pull/$PR/head" | cut -f1)"
            if [[ "$remote_head" = "$EXPECTED_SHA" ]]
            then
              success=1
              break
            fi
            echo "::notice::Remote repository not in sync. Checking again in ${timeout}s..."
            sleep "$timeout"
            attempt=$(( attempt + 1 ))
            timeout=$(( timeout * 2 ))
          done

          # One last check...
          if [[ -z "$success" ]] &&
             [[ "$(git ls-remote origin "pull/$PR/head" | cut -f1)" != "$EXPECTED_SHA" ]]
          then
            echo "::error::No attempts remaining. Giving up."
            exit 1
          fi

      - name: Merge PR
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.brew-pr-pull.outputs.head_sha }}
        run: |
          gh pr merge \
            --delete-branch \
            --match-head-commit="$EXPECTED_SHA" \
            --merge \
            "$PR"
