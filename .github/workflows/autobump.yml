name: Bump formulae on schedule or request

on:
  workflow_dispatch:
    inputs:
      formulae:
        description: Custom list of formulae to livecheck and bump if outdated
        required: false
  schedule:
    - cron: "0 22 * * *"

permissions:
  contents: read

jobs:
  autobump:
    runs-on: macos-latest
    environment: github_actions
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@f8d4222eb633e65c2a0157383cf80861fc7fae7f # 2026.09.07.1
        with:
          cask: false
          core: false
          test-bot: false

      - name: Configure Git user
        uses: Homebrew/actions/git-user-config@f8d4222eb633e65c2a0157383cf80861fc7fae7f # 2026.09.07.1
        with:
          username: ${{ (github.event_name == 'workflow_dispatch' && github.actor) || 'bkdbot' }}

      - name: Bump casks
        id: autobump
        run: brew bump --open-pr --no-fork --tap bevanjkay/formulae
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.BOT_TOKEN }}
