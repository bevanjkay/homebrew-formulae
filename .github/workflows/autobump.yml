name: Bump formulae on schedule or request

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/autobump.yml
  workflow_dispatch:
    inputs:
      formulae:
        description: Custom list of formulae to livecheck and bump if outdated
        required: false
  schedule:
    - cron: "0 22 * * *"

concurrency:
  group: autobump-${{ case(!!inputs.formulae, github.run_id, 'scheduled') }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  autobump:
    if: github.repository_owner == 'bevanjkay' && github.ref == 'refs/heads/main'
    outputs:
      formulae: ${{ steps.bump.outputs.formulae }}
      artifact: ${{ steps.upload.outputs.artifact-id }}
    runs-on: macos-latest
    env:
      HOMEBREW_DEVELOPER: 1
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1
        with:
          core: false
          cask: false

      - run: brew config

      - name: Bump formulae
        id: bump
        env:
          HOMEBREW_TEST_BOT_AUTOBUMP: 1
        run: brew bump --tap=bevanjkay/formulae --prepare-prs=bumps.json

      - name: Upload bumps
        if: ${{ !cancelled() && steps.bump.outputs.formulae != '' }}
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: bumps.json
          archive: false
          overwrite: true
          retention-days: 1

  publish:
    needs: autobump
    if: ${{ !cancelled() && needs.autobump.outputs.artifact != '' }}
    runs-on: ubuntu-latest
    environment: github_actions
    strategy:
      fail-fast: false
      matrix:
        formula: ${{ fromJSON(needs.autobump.outputs.formulae) }}
    steps:
      - name: Set up Homebrew
        id: setup
        uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1
        with:
          core: false
          cask: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bumps.json
          skip-decompress: true

      - name: Configure Git user
        uses: Homebrew/actions/git-user-config@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1
        with:
          username: ${{ case(github.event_name == 'workflow_dispatch', github.actor, 'bkdbot') }}

      - name: Prepare branch
        id: bump
        env:
          FORMULA: ${{ matrix.formula }}
        run: brew bump --tap=bevanjkay/formulae --commit-pr-from=bumps.json -- "$FORMULA"

      - name: Check branch
        id: sign
        if: steps.bump.outputs.branch
        run: brew bump --tap=bevanjkay/formulae --sign-pr

      - name: Push branch
        if: steps.sign.outputs.push
        uses: Homebrew/actions/git-try-push@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1
        with:
          branch: ${{ steps.bump.outputs.branch }}
          directory: ${{ steps.setup.outputs.repository-path }}
          tries: 1
          force: ${{ steps.sign.outputs.force }}
          no_lease: ${{ steps.sign.outputs.force }}
          token: ${{ secrets.BOT_TOKEN }}

      - name: Open pull request
        if: steps.bump.outputs.branch
        uses: Homebrew/actions/create-pull-request@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1
        with:
          head: ${{ steps.bump.outputs.branch }}
          base: main
          title: ${{ fromJSON(steps.bump.outputs.pr).title }}
          body: ${{ fromJSON(steps.bump.outputs.pr).body }}
          token: ${{ secrets.BOT_TOKEN }}
